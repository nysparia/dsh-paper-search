# Patch bundle for dsh-paper-search.
#
# This shape is COPIED from a bundle already proven to install in a profile
# (`dsh-ai-memory/cordis.patch.yml`) — not invented:
#
#     - insert:
#         - id: <id>
#           name: <npm package name>
#
# `id` must be UNIQUE. The loader throws `duplicate loader entry id` when the
# same id appears twice, and that happens BEFORE the application gets a chance
# to warn.
#
# `path` is NOT written here: an `insert` entry names only the package, and DSH
# resolves the entry file from the package's `main`/`exports` in package.json.
- insert:
    - id: paper-search
      name: dsh-paper-search
